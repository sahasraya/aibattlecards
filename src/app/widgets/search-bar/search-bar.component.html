<div class="search-container" [class.search-focused]="isSearchFocused">
    <input 
        type="text" 
        class="search-bar" 
        placeholder="Search for products, services, or categories..."
        [(ngModel)]="searchText" 
        (input)="onSearchInput($event)" 
        (focus)="onSearchFocus()" 
        (blur)="onSearchBlur()"
        (keydown.enter)="onEnterPress()" 
        autocomplete="off" 
    />

    <!-- Loading indicator - Circle Progress -->
    <div *ngIf="isLoading" class="loading-indicator">
        <div class="spinner"></div>
    </div>

    <!-- Search dropdown -->
    <div *ngIf="showDropdown" class="search-dropdown">
        <!-- Loading state with circle spinner -->
        <div *ngIf="isLoading" class="loading-results">
            <div class="spinner-large"></div>
            <p class="loading-text">Searching...</p>
        </div>

        <!-- No results found -->
        <div *ngIf="!isLoading && searchResults.length === 0 && searchText.length >= 2" class="no-results">
            <div class="no-results-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
            </div>
            <p class="no-results-title">No results found</p>
            <p class="no-results-message">We couldn't find any products matching "<strong>{{ searchText }}</strong>"</p>
            <p class="no-results-suggestion">Try different keywords or check your spelling</p>
        </div>

        <!-- Search results -->
        <div *ngIf="!isLoading && searchResults.length > 0">
            <div *ngFor="let product of searchResults" class="search-result-item" (click)="onProductSelect(product)">
                <div class="product-image">
                    <img [src]="product.productimage" [alt]="product.productname" />
                </div>

                <div class="product-info">
                    <div class="product-name">{{ product.productname }}</div>
                    <div class="product-category">{{ product.productcategory }}</div>
                    <div *ngIf="product.useCases && product.useCases.length > 0" class="product-usecases">
                        <span class="usecase-label">Use cases:</span>
                        <span *ngFor="let usecase of product.useCases.slice(0, 3)" class="usecase-tag">
                            {{ usecase }}
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Backdrop for mobile focus -->
<div class="search-backdrop" [class.active]="isSearchFocused" (click)="closeSearch()"></div>
