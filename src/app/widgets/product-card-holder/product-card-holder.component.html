<div class="featured-container">
    <div class="scroll-wrapper">
        <!-- Left Arrow -->
        <button class="scroll-btn left" (click)="scrollLeft(cardContainer)">
            <img src="../../../assets/images/leftarrow.png" alt="scroll left" />
        </button>

        <!-- Cards Container -->
        <div class="cards-container" #cardContainer>
            <div class="product-card" *ngFor="let product of featuredArrayDetails" [routerLink]="['/home/product-item']"
                [queryParams]="{ productid: product.productid }" [class.featured-product]="product.isFeatured === 1">

                <!-- Icon -->
                <div class="product-icon">
                    <img [src]="product.icon" alt="icon" />
                </div>

                <!-- Info -->
                <div class="product-info">
                    <h3 class="product-name">{{ product.name }}</h3>
                    <span class="card-badge" *ngIf="product.isFeatured === 1">Featured</span>
                    <span class="card-badge" *ngIf="product.isFeatured !== 1">{{ (product.tags?.[0] || 'Tool') | uppercase }}</span>
                    <p class="product-desc" *ngIf="product.description">
                        {{ product.description | slice:0:55 }}{{ (product.description?.length ?? 0) > 55 ? '...' : '' }}
                    </p>
                </div>

                <!-- Stats -->
                <div class="card-stats" *ngIf="product.downloads || product.rating">
                    <span class="stat-item" *ngIf="product.downloads">
                        <span class="stat-dl">↓</span> {{ product.downloads }}
                    </span>
                    <span class="stat-item" *ngIf="product.rating">
                        <span class="stat-star">★</span> {{ product.rating }}
                    </span>
                </div>
            </div>
        </div>

        <!-- Right Arrow -->
        <button class="scroll-btn right" (click)="scrollRight(cardContainer)">
            <img src="../../../assets/images/rightarrow.png" alt="scroll right" />
        </button>
    </div>
</div>
