<!-- Featured Section -->
<div *ngIf="featuredArrayDetails.length > 0">
  <div class="getmoreresult">
  <h2 class="section-title" (click)="getmoreresult('featured')">Featured</h2>
 
</div>

<app-post-slider-shimmer *ngIf="isLoadingFeatured" [cardCount]="5"></app-post-slider-shimmer>
<div *ngIf="!isLoadingFeatured" class="cards-grid">
  <app-smaller-product-card *ngFor="let product of featuredArrayDetails" [product]="product"></app-smaller-product-card>
</div>

</div>





<div *ngIf="NewArrayDetails.length > 0">
  <!-- New Products Section -->
<div class="getmoreresult">
  <h2 class="section-title" (click)="getmoreresult('new')">New</h2>
   
</div>

<app-post-slider-shimmer *ngIf="isLoadingNew" [cardCount]="5"></app-post-slider-shimmer>
<div *ngIf="!isLoadingNew" class="cards-grid">
  <app-smaller-product-card *ngFor="let product of NewArrayDetails" [product]="product"></app-smaller-product-card>
</div>

</div>



<div *ngIf="MostViewedArrayDetails.length > 0">
  
<!-- Most Viewed Section -->
<div class="getmoreresult">
  <h2 class="section-title" (click)="getmoreresult('mostviewed')">Most Viewed</h2>
  
</div>

<app-post-slider-shimmer *ngIf="isLoadingMostViewed" [cardCount]="5"></app-post-slider-shimmer>
<div *ngIf="!isLoadingMostViewed" class="cards-grid">
  <app-smaller-product-card *ngFor="let product of MostViewedArrayDetails" [product]="product"></app-smaller-product-card>
</div>

</div>

<!-- All Products Section -->
<h2 class="section-title">All</h2>
